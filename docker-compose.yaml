services:
  db:
    image: mongo
    container_name: whisper_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASS}
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE}
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
